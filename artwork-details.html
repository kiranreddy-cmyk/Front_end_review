<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artwork Details &amp; Provenance — ZENITH Fine Art Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <img src="images/logo.svg" alt="ZENITH Fine Art Gallery">
      </a>

      <button type="button" class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="artworks.html" class="active">Gallery</a></li>
        <li><a href="artist-profile.html">Artists</a></li>
        <li><a href="auction.html">Auctions</a></li>
        <li><a href="exhibitions.html">Exhibitions</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="about.html">About</a></li>
      </ul>

      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top: 38px;">
      <!-- Breadcrumb -->
      <div style="margin-bottom: 20px; font-size: 0.88rem; color: var(--text-muted);">
        <a href="index.html" style="color: var(--gold-primary);">Home</a> &gt;
        <a href="artworks.html" style="color: var(--gold-primary);">Gallery</a> &gt;
        <span id="breadcrumbTitle" style="color: #ffffff; font-weight: 600;">Artwork Details</span>
      </div>

      <!-- Artwork Details Component -->
      <div id="artworkDetailsContainer">
        <!-- Rendered dynamically via artworks.js -->
      </div>

      <!-- Collector Critiques & Ratings -->
      <section style="background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 34px; margin-top: 38px; box-shadow: var(--shadow-md);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px;">
          <div>
            <h2 style="font-size: 1.7rem; color: #ffffff;">Collector Critiques &amp; Ratings</h2>
            <span id="artworkReviewCount" style="color: var(--text-muted); font-size: 0.88rem;">(0 Customer Reviews)</span>
          </div>
        </div>

        <div style="background: var(--bg-black); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; margin-bottom: 28px;">
          <h3 style="font-size: 1.2rem; color: #ffffff; margin-bottom: 14px;">Leave Your Appraisal</h3>
          <form onsubmit="submitArtworkReview(event, Number(new URLSearchParams(window.location.search).get('id')) || 1)">
            <div class="form-group" style="margin-bottom: 14px;">
              <label>Star Rating</label>
              <div class="star-picker" style="justify-content: flex-end;">
                <input type="radio" id="detailStar5" name="ratingStar" value="5" checked><label for="detailStar5">★</label>
                <input type="radio" id="detailStar4" name="ratingStar" value="4"><label for="detailStar4">★</label>
                <input type="radio" id="detailStar3" name="ratingStar" value="3"><label for="detailStar3">★</label>
                <input type="radio" id="detailStar2" name="ratingStar" value="2"><label for="detailStar2">★</label>
                <input type="radio" id="detailStar1" name="ratingStar" value="1"><label for="detailStar1">★</label>
              </div>
            </div>

            <div class="form-group">
              <label for="reviewCommentInput">Written Critique</label>
              <textarea id="reviewCommentInput" class="form-control" rows="3" placeholder="Share your perspective on composition, brushwork, light, and emotional resonance..." required></textarea>
            </div>

            <button type="submit" class="btn btn-gold">Submit Critique</button>
          </form>
        </div>

        <div id="artworkReviewsList">
          <!-- Populated dynamically via reviews.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ZENITH Fine Art Gallery. All rights reserved.</div>
      <div style="color: var(--gold-primary);">Certified Fine Art Provenance</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/config.local.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/artworks.js"></script>
</body>
</html>
