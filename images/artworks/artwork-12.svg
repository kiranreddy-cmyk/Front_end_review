<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Museum Chiaroscuro Sculpture Backdrop -->
    <radialGradient id="marbleWall" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#322E2A" />
      <stop offset="45%" stop-color="#211E1B" />
      <stop offset="85%" stop-color="#141210" />
      <stop offset="100%" stop-color="#0A0908" />
    </radialGradient>
    <!-- Carrara White Marble (Luminous Translucent Stone) -->
    <linearGradient id="carraraMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#F5F2EC" />
      <stop offset="70%" stop-color="#D9D3C7" />
      <stop offset="100%" stop-color="#9E9689" />
    </linearGradient>
    <linearGradient id="marbleShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8B0A2" />
      <stop offset="50%" stop-color="#736B5E" />
      <stop offset="100%" stop-color="#38332A" />
    </linearGradient>
    <!-- Dark Marble Gallery Pedestal -->
    <linearGradient id="pedestal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D3730" />
      <stop offset="100%" stop-color="#1A1714" />
    </linearGradient>
  </defs>

  <!-- Gallery Wall Background -->
  <rect width="800" height="600" fill="url(#marbleWall)" />

  <!-- Directional Museum Spotlight Glow -->
  <circle cx="400" cy="240" r="220" fill="#FFFBF5" opacity="0.05" />

  <!-- Classical Museum Gallery Pedestal -->
  <g transform="translate(260, 420)">
    <!-- Top Plinth Surface in Perspective -->
    <polygon points="40,0 240,0 280,26 0,26" fill="#4A433A" />
    <!-- Pedestal Shaft -->
    <rect x="0" y="26" width="280" height="154" fill="url(#pedestal)" />
    <!-- Antique Gold Molded Trim -->
    <line x1="0" y1="26" x2="280" y2="26" stroke="#B08D57" stroke-width="1.5" />
    <line x1="0" y1="160" x2="280" y2="160" stroke="#B08D57" stroke-width="1.2" opacity="0.6" />
    <!-- Cast Shadow on Gallery Floor -->
    <ellipse cx="140" cy="180" rx="180" ry="14" fill="#050403" opacity="0.9" />
  </g>

  <!-- Carved Carrara Marble Botanical Flora Sculpture -->
  <g transform="translate(260, 80)">
    <!-- Cast Shadow of Sculpture on Top of Pedestal -->
    <ellipse cx="140" cy="340" rx="80" ry="12" fill="#120F0D" opacity="0.85" />

    <!-- Marble Petal / Flange 1 (Rear Left Shadow) -->
    <path d="M 140 330 C 50 280 20 180 60 100 C 100 20 170 50 160 140 Z" fill="url(#marbleShadow)" />

    <!-- Marble Petal / Flange 2 (Rear Right) -->
    <path d="M 140 330 C 230 280 260 170 220 90 C 180 10 120 40 130 130 Z" fill="#C7BFB1" />

    <!-- Primary Swirling Botanical Form (Front Illuminating Chiaroscuro) -->
    <path d="M 140 340 C 70 290 50 190 100 110 C 150 30 230 60 210 160 C 190 260 170 330 140 340 Z" fill="url(#carraraMarble)" stroke="#7A7264" stroke-width="0.8" />

    <!-- Elegant Inner Carved Spiral / Calyx Core -->
    <path d="M 100 110 C 140 70 190 90 180 160 C 170 230 140 280 140 330 C 120 270 100 210 120 150 C 130 120 115 110 100 110 Z" fill="url(#carraraMarble)" />

    <!-- Fine Translucent Marble Highlights (Directional Light Edge) -->
    <path d="M 100 110 C 150 30 230 60 210 160" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.95" stroke-linecap="round" />
    <path d="M 140 340 C 70 290 50 190 100 110" stroke="#FFFDF8" stroke-width="2" fill="none" opacity="0.85" />
    <path d="M 130 150 C 160 130 180 160 170 220" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.9" />

    <!-- Delicate Vein of Grey-Gold Mineral in Carrara Stone -->
    <path d="M 120 80 Q 150 140 160 240" stroke="#B08D57" stroke-width="0.7" fill="none" opacity="0.35" />
  </g>

  <!-- Museum Exhibition Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.45" />
</svg>
