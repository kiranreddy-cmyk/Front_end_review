<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="gallerySpotlight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="carraraMarble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="marbleShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#gallerySpotlight)" />
  <!-- Pedestal -->
  <polygon points="210,350 390,350 430,410 170,410" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <rect x="170" y="410" width="260" height="30" fill="#020617" />
  <!-- Floral Botanical Marble Sculpture -->
  <g transform="translate(300, 210)">
    <!-- Back Petals -->
    <path d="M 0 50 C -110 30 -140 -80 -70 -130 C -20 -110 0 0 0 50" fill="url(#marbleShadow)" />
    <path d="M 0 50 C 110 30 140 -80 70 -130 C 20 -110 0 0 0 50" fill="url(#marbleShadow)" />
    <!-- Center Blooming Leaf Form -->
    <path d="M 0 60 C -60 -20 -80 -120 0 -170 C 80 -120 60 -20 0 60" fill="url(#carraraMarble)" />
    <!-- Marble veining detail -->
    <path d="M -15 -140 Q 5 -80 -2 -20" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6" />
    <path d="M 12 -120 Q -8 -60 10 10" stroke="#94a3b8" stroke-width="1" fill="none" opacity="0.5" />
    <!-- Curving graceful front petals -->
    <path d="M -5 50 C -90 10 -80 -70 -30 -90 C -20 -20 0 30 -5 50" fill="#f1f5f9" />
    <path d="M 5 50 C 90 10 80 -70 30 -90 C 20 -20 0 30 5 50" fill="#f8fafc" />
    <!-- Soft light reflections -->
    <path d="M -8 -130 Q 8 -150 15 -120" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  </g>
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="end">Marble Flora • Hand-Carved Carrara Marble</text>
</svg>
