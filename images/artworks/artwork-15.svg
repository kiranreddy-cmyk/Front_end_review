<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Dutch Golden Age Chiaroscuro -->
    <radialGradient id="vanitasGlow" cx="35%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#3D2915" />
      <stop offset="35%" stop-color="#24160A" />
      <stop offset="75%" stop-color="#140C05" />
      <stop offset="100%" stop-color="#080402" />
    </radialGradient>
    <linearGradient id="leatherBook" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E2B16" />
      <stop offset="60%" stop-color="#4A1C0E" />
      <stop offset="100%" stop-color="#240B05" />
    </linearGradient>
    <linearGradient id="brassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D4" />
      <stop offset="40%" stop-color="#D9A855" />
      <stop offset="80%" stop-color="#9C6B28" />
      <stop offset="100%" stop-color="#4F320E" />
    </linearGradient>
  </defs>

  <!-- Deep Umber Studio Canvas Ground -->
  <rect width="800" height="600" fill="url(#vanitasGlow)" />

  <!-- Heavy Oak Table Surface with Velvet Cloth Drape -->
  <polygon points="0,450 800,420 800,600 0,600" fill="#1C1109" />
  <!-- Crimson Velvet Table Drapery Fold -->
  <path d="M 0 450 Q 150 440 280 470 L 250 600 L 0 600 Z" fill="#4A1215" opacity="0.8" />
  <path d="M 50 455 Q 160 480 220 560" stroke="#781D23" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Classical Leather-Bound Folios Stack (Dutch Vanitas Element) -->
  <g transform="translate(360, 310)">
    <!-- Bottom Folio (Large Volume) -->
    <!-- Spine -->
    <rect x="-80" y="70" width="220" height="40" rx="3" fill="url(#leatherBook)" stroke="#1A0A04" stroke-width="1.2" />
    <!-- Gold Tooling on Spine -->
    <line x1="-70" y1="78" x2="130" y2="78" stroke="#D9A855" stroke-width="1.5" />
    <line x1="-70" y1="102" x2="130" y2="102" stroke="#D9A855" stroke-width="1.5" />
    <!-- Page Edges (Aged Gold Gilt) -->
    <polygon points="140,70 180,60 180,100 140,110" fill="#C4A86C" />

    <!-- Top Folio (Slightly Turned Perspective) -->
    <g transform="rotate(-6 10 50)">
      <rect x="-60" y="30" width="180" height="34" rx="2" fill="#241E18" stroke="#0E0C0A" stroke-width="1.2" />
      <line x1="-50" y1="36" x2="110" y2="36" stroke="#D9A855" stroke-width="1.2" />
      <line x1="-50" y1="58" x2="110" y2="58" stroke="#D9A855" stroke-width="1.2" />
      <polygon points="120,30 150,22 150,56 120,64" fill="#C4A86C" />
    </g>
  </g>

  <!-- Antique Brass Armillary Sphere / Astrolabe (Symbol of Astronomy & Wisdom) -->
  <g transform="translate(240, 220)">
    <!-- Turned Brass Pedestal Base -->
    <ellipse cx="60" cy="180" rx="45" ry="12" fill="url(#brassGlow)" />
    <rect x="54" y="110" width="12" height="70" fill="url(#brassGlow)" />
    <circle cx="60" cy="110" r="14" fill="url(#brassGlow)" />

    <!-- Interlocking Armillary Rings (Chiaroscuro Brass) -->
    <circle cx="60" cy="60" r="65" fill="none" stroke="url(#brassGlow)" stroke-width="5" />
    <ellipse cx="60" cy="60" rx="65" ry="25" fill="none" stroke="url(#brassGlow)" stroke-width="4" transform="rotate(35 60 60)" />
    <ellipse cx="60" cy="60" rx="65" ry="25" fill="none" stroke="url(#brassGlow)" stroke-width="3" transform="rotate(-35 60 60)" />
    <!-- Central Terrestrial Globe -->
    <circle cx="60" cy="60" r="16" fill="#8C662B" stroke="#FFF2D4" stroke-width="1.5" />
    <!-- Gilt Highlight Beams -->
    <path d="M 15 25 Q 60 10 105 25" stroke="#FFFDF8" stroke-width="2" fill="none" opacity="0.9" />
  </g>

  <!-- Unrolled Rag Parchment Map with Red Wax Seal -->
  <g transform="translate(480, 410)">
    <path d="M 0 40 C 60 20 160 30 220 50 L 200 130 C 140 110 40 100 -20 120 Z" fill="#E8DEC5" stroke="#9C8B68" stroke-width="1" />
    <!-- Classical Cartographic Lines -->
    <circle cx="90" cy="75" r="22" fill="none" stroke="#A8946E" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="90" y1="50" x2="90" y2="100" stroke="#A8946E" stroke-width="1" />
    <!-- Red Imperial Wax Seal -->
    <circle cx="170" cy="85" r="14" fill="#991B1B" stroke="#7F1D1D" stroke-width="1.5" />
    <circle cx="170" cy="85" r="7" fill="#B91C1C" />
  </g>

  <!-- Fine Antique Gilt Frame Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.5" opacity="0.45" />
</svg>
