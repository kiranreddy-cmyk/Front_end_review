  <path d="M 0 410 Q 200 390 400 415 Q 500 425 600 405 L 600 450 L 0 450 Z" fill="#ecfdf5" opacity="0.35" />
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#86efac" text-anchor="end">Soul of the Wild • Fine Art Photography</text>
