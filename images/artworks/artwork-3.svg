<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="photoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181818" />
      <stop offset="35%" stop-color="#32302E" />
      <stop offset="70%" stop-color="#55524E" />
      <stop offset="90%" stop-color="#8A857E" />
      <stop offset="100%" stop-color="#C4BEB6" />
    </linearGradient>
    <radialGradient id="mistLight" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EDE9E3" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#BFB9B0" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#242220" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Museum Passe-partout (Matte Border) -->
  <rect width="800" height="600" fill="#242220" />
  <rect x="35" y="35" width="730" height="530" fill="#151413" />

  <!-- Atmospheric Forest Mist Background -->
  <rect x="40" y="40" width="720" height="520" fill="url(#photoGrad)" />
  <circle cx="400" cy="240" r="280" fill="url(#mistLight)" />

  <!-- Misty Tree Trunks Silhouettes (Layered Depth) -->
  <!-- Far Trees -->
  <g fill="#45423E" opacity="0.4">
    <rect x="120" y="40" width="22" height="480" />
    <rect x="250" y="40" width="18" height="480" />
    <rect x="520" y="40" width="26" height="480" />
    <rect x="660" y="40" width="20" height="480" />
  </g>

  <!-- Midground Trees -->
  <g fill="#2B2927" opacity="0.7">
    <rect x="170" y="40" width="36" height="500" />
    <rect x="580" y="40" width="42" height="500" />
    <line x1="170" y1="180" x2="220" y2="120" stroke="#2B2927" stroke-width="8" stroke-linecap="round" />
    <line x1="620" y1="210" x2="570" y2="150" stroke="#2B2927" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Foreground Atmospheric Mist Layer -->
  <rect x="40" y="360" width="720" height="200" fill="#201E1D" opacity="0.85" />

  <!-- Majestic Highland Stag Silhouette (Fine Art Photography Centerpiece) -->
  <g transform="translate(340, 150)">
    <!-- Antlers (Exquisite Symmetry & Power) -->
    <!-- Left Main Beam & Tines -->
    <path d="M 50 110 C 20 80 -10 40 10 -20 C 18 -10 25 10 35 30" stroke="#121110" stroke-width="6.5" fill="none" stroke-linecap="round" />
    <path d="M 30 70 C 5 60 -25 55 -40 40" stroke="#121110" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 22 40 C -5 20 -20 -5 -25 -25" stroke="#121110" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 12 10 C 2 -15 0 -45 15 -60" stroke="#121110" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Right Main Beam & Tines -->
    <path d="M 70 110 C 100 80 130 40 110 -20 C 102 -10 95 10 85 30" stroke="#121110" stroke-width="6.5" fill="none" stroke-linecap="round" />
    <path d="M 90 70 C 115 60 145 55 160 40" stroke="#121110" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 98 40 C 125 20 140 -5 145 -25" stroke="#121110" stroke-width="4.5" fill="none" stroke-linecap="round" />
    <path d="M 108 10 C 118 -15 120 -45 105 -60" stroke="#121110" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Head & Ears -->
    <path d="M 40 120 C 20 110 15 125 35 135 Z" fill="#121110" />
    <path d="M 80 120 C 100 110 105 125 85 135 Z" fill="#121110" />
    <!-- Noble Crown and Muzzle -->
    <polygon points="50,110 70,110 68,160 60,185 52,160" fill="#121110" />
    <!-- Strong Muscular Neck & Chest -->
    <path d="M 45 150 C 35 180 20 220 -20 270 L 140 270 C 100 220 85 180 75 150 Z" fill="#121110" />
    <!-- Chiaroscuro Rim Light on Stag Crown -->
    <path d="M 50 112 L 58 175" stroke="#EDE9E3" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />
  </g>

  <!-- Foreground Crag / Peat Moss Terrain -->
  <polygon points="40,560 140,510 320,530 520,505 700,535 760,560" fill="#100F0E" />

  <!-- Antique Gold Museum Trim -->
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#B08D57" stroke-width="1" opacity="0.65" />
</svg>
