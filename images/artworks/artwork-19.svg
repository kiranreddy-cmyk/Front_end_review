<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Aged Silk Scroll Ground -->
    <radialGradient id="silkScroll" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FCF9F2" />
      <stop offset="60%" stop-color="#F2EBDC" />
      <stop offset="100%" stop-color="#E2D6C0" />
    </radialGradient>
    <linearGradient id="inkMist" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1817" />
      <stop offset="40%" stop-color="#3D3A37" />
      <stop offset="70%" stop-color="#6E6963" />
      <stop offset="100%" stop-color="#A8A29B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Fine Woven Silk Scroll Ground -->
  <rect width="800" height="600" fill="url(#silkScroll)" />

  <!-- Pale Distant Mountain Ridge in Morning Mist (Haboku Technique) -->
  <path d="M 0 240 Q 200 140 400 190 T 800 160 L 800 360 L 0 360 Z" fill="#999187" opacity="0.3" />
  <path d="M 0 300 Q 250 210 500 270 T 800 230 L 800 420 L 0 420 Z" fill="#665F57" opacity="0.45" />

  <!-- Solitary Mountain Peak Towering Above Cloud Layers -->
  <polygon points="460,340 540,110 630,360" fill="#3D3934" opacity="0.65" />
  <polygon points="540,110 560,115 620,350 590,350" fill="#24211E" opacity="0.8" />

  <!-- Morning Mist Cloud Ribbon Crossing Peaks -->
  <path d="M 200 280 Q 400 250 600 290 T 800 270 L 800 340 L 200 340 Z" fill="#F2EBDC" opacity="0.85" />

  <!-- Foreground Atmospheric Pine Branch / Zen Bamboo (Expressive Ink Wash) -->
  <g transform="translate(140, 260)" stroke="#1C1A18" fill="none">
    <!-- Gnarled Master Pine Branch -->
    <path d="M -140 260 C -40 220 20 180 80 140 C 140 100 240 120 320 80" stroke-width="8" stroke-linecap="round" />
    <path d="M 80 140 C 120 110 180 90 220 40" stroke-width="5" stroke-linecap="round" />
    <path d="M 140 100 C 160 70 200 60 250 30" stroke-width="3" stroke-linecap="round" />

    <!-- Delicate Pine Needle Clusters (Calligraphic Strokes) -->
    <g stroke-width="1.8" stroke-linecap="round" opacity="0.85">
      <!-- Cluster 1 -->
      <line x1="320" y1="80" x2="350" y2="60" />
      <line x1="320" y1="80" x2="360" y2="75" />
      <line x1="320" y1="80" x2="355" y2="95" />
      <line x1="320" y1="80" x2="340" y2="105" />
      <!-- Cluster 2 -->
      <line x1="220" y1="40" x2="245" y2="15" />
      <line x1="220" y1="40" x2="255" y2="30" />
      <line x1="220" y1="40" x2="250" y2="50" />
      <!-- Cluster 3 -->
      <line x1="250" y1="30" x2="280" y2="10" />
      <line x1="250" y1="30" x2="290" y2="25" />
      <line x1="250" y1="30" x2="285" y2="45" />
    </g>
  </g>

  <!-- Tiny Mountain Temple Pagoda emerging from Pine Mist -->
  <g transform="translate(580, 240)" fill="#24211E">
    <rect x="25" y="40" width="30" height="25" />
    <polygon points="15,40 65,40 40,25" />
    <polygon points="20,25 60,25 40,12" />
    <line x1="40" y1="0" x2="40" y2="12" stroke="#24211E" stroke-width="2" />
  </g>

  <!-- Red Vermilion Atelier Seal Stamp -->
  <rect x="680" y="460" width="36" height="54" fill="#992B2B" rx="2" />
  <rect x="684" y="464" width="28" height="46" fill="none" stroke="#F2EBDC" stroke-width="1.2" />
  <line x1="698" y1="468" x2="698" y2="506" stroke="#F2EBDC" stroke-width="1.2" />

  <!-- Classical Silk Border Trim -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.4" />
</svg>
