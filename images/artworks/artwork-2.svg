<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#cyberBg)" />
  <!-- Perspective Grid lines -->
  <g stroke="#3b82f6" stroke-width="1.2" opacity="0.35">
    <line x1="300" y1="200" x2="-100" y2="450" />
    <line x1="300" y1="200" x2="50" y2="450" />
    <line x1="300" y1="200" x2="180" y2="450" />
    <line x1="300" y1="200" x2="300" y2="450" />
    <line x1="300" y1="200" x2="420" y2="450" />
    <line x1="300" y1="200" x2="550" y2="450" />
    <line x1="300" y1="200" x2="700" y2="450" />
    <!-- Horizontal perspective lines -->
    <line x1="150" y1="260" x2="450" y2="260" />
    <line x1="100" y1="300" x2="500" y2="300" />
    <line x1="40" y1="350" x2="560" y2="350" />
    <line x1="0" y1="410" x2="600" y2="410" />
  </g>
  <!-- Cyber Sun / Orb -->
  <circle cx="300" cy="180" r="85" fill="none" stroke="url(#neonPink)" stroke-width="6" />
  <circle cx="300" cy="180" r="65" fill="#ec4899" opacity="0.15" />
  <!-- Futuristic Skyline Silhouettes -->
  <rect x="60" y="110" width="35" height="110" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <rect x="110" y="80" width="45" height="140" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
  <polygon points="170,220 185,90 200,220" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
  <rect x="400" y="90" width="40" height="130" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
  <rect x="460" y="120" width="35" height="100" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <polygon points="510,220 530,70 550,220" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" />
  <!-- Floating Hologram Pyramids -->
  <polygon points="300,100 260,165 340,165" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9" />
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#06b6d4" text-anchor="end">Neon Cyber Odyssey • 3D Render</text>
</svg>
