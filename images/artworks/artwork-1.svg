<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="600" height="450" fill="url(#skyGrad)" />
  <!-- Sun -->
  <circle cx="300" cy="220" r="140" fill="url(#sunGrad)" />
  <circle cx="300" cy="220" r="50" fill="#fffbeb" opacity="0.9" />
  <!-- Distant Mountains -->
  <polygon points="0,320 120,240 240,310 380,210 520,300 600,260 600,450 0,450" fill="url(#mountGrad1)" opacity="0.85" />
  <!-- Warm Foreground Hills -->
  <polygon points="0,360 160,290 320,370 480,290 600,350 600,450 0,450" fill="url(#mountGrad2)" opacity="0.95" />
  <!-- River Reflection -->
  <path d="M 280 370 Q 300 390 260 410 Q 320 430 350 450 L 250 450 Q 230 430 200 410 Q 250 390 280 370 Z" fill="#fef3c7" opacity="0.6" />
  <!-- Pine Silhouettes -->
  <polygon points="80,390 90,340 100,390" fill="#0f172a" />
  <polygon points="105,400 115,355 125,400" fill="#0f172a" />
  <polygon points="510,380 520,330 530,380" fill="#0f172a" />
  <!-- Category Tag In Canvas -->
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end" opacity="0.7">Golden Horizon • Oil on Canvas</text>
</svg>
