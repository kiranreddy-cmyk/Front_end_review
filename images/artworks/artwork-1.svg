<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky & Golden Hour Atmosphere -->
    <linearGradient id="sky1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D2B1F" />
      <stop offset="35%" stop-color="#8C5E35" />
      <stop offset="65%" stop-color="#C98B48" />
      <stop offset="85%" stop-color="#E8B878" />
      <stop offset="100%" stop-color="#FCE4B8" />
    </linearGradient>
    <!-- Alpine Crags Chiaroscuro -->
    <linearGradient id="mount1A" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241E1A" />
      <stop offset="60%" stop-color="#362C24" />
      <stop offset="100%" stop-color="#4F3E33" />
    </linearGradient>
    <linearGradient id="mount1Sun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DF9B52" />
      <stop offset="50%" stop-color="#F2C98A" />
      <stop offset="100%" stop-color="#FDF0D5" />
    </linearGradient>
    <!-- Water Glaze Reflection -->
    <linearGradient id="lakeReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C98B48" />
      <stop offset="30%" stop-color="#6B4E36" />
      <stop offset="70%" stop-color="#2D231C" />
      <stop offset="100%" stop-color="#191410" />
    </linearGradient>
    <!-- Gilt Sun Disc -->
    <radialGradient id="sunAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="1" />
      <stop offset="30%" stop-color="#FBD693" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#DF9548" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#DF9548" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Surface / Fine Art Linen Tone -->
  <rect width="800" height="600" fill="#1C1815" />
  
  <!-- Atmospheric Sky -->
  <rect x="0" y="0" width="800" height="420" fill="url(#sky1)" />

  <!-- Radiant Golden Sun -->
  <circle cx="430" cy="270" r="160" fill="url(#sunAura)" />
  <circle cx="430" cy="270" r="32" fill="#FFFDF8" opacity="0.95" />

  <!-- Distant Atmospheric Mountain Ridge -->
  <polygon points="0,320 80,280 190,300 310,240 430,285 540,230 670,290 800,260 800,420 0,420" fill="#5A4332" opacity="0.6" />

  <!-- Master Peak (Sharp Chiaroscuro Face) -->
  <!-- Shadow Face -->
  <polygon points="120,400 280,180 380,410" fill="url(#mount1A)" />
  <!-- Light Illuminated Face -->
  <polygon points="280,180 325,185 410,380 380,410" fill="url(#mount1Sun)" opacity="0.9" />

  <!-- Secondary Mountain Peak (Right) -->
  <polygon points="460,420 560,195 620,235 720,420" fill="url(#mount1A)" />
  <polygon points="560,195 600,205 680,420 620,420" fill="url(#mount1Sun)" opacity="0.85" />

  <!-- Foreground Alpine Ridge & Slopes -->
  <polygon points="0,380 180,310 340,390 490,330 680,410 800,340 800,460 0,460" fill="#2E241C" />
  <polygon points="0,420 220,360 450,440 650,380 800,430 800,480 0,480" fill="#1E1712" />

  <!-- Alpine Pine Tree Silhouettes -->
  <g fill="#140F0C">
    <polygon points="60,390 68,310 76,390" />
    <polygon points="85,410 94,325 103,410" />
    <polygon points="110,420 118,340 126,420" />
    <polygon points="140,435 147,365 154,435" />
    <polygon points="680,430 688,350 696,430" />
    <polygon points="710,420 719,330 728,420" />
    <polygon points="745,440 752,360 759,440" />
  </g>

  <!-- Still Glacial Mirror Lake -->
  <rect x="0" y="440" width="800" height="160" fill="url(#lakeReflect)" />
  
  <!-- Golden Water Highlights / Impasto Strokes -->
  <path d="M 370 450 Q 430 460 490 450" stroke="#FCE4B8" stroke-width="2" opacity="0.75" />
  <path d="M 340 470 Q 430 480 520 470" stroke="#F2C98A" stroke-width="2.5" opacity="0.8" />
  <path d="M 310 495 Q 430 505 550 495" stroke="#DF9B52" stroke-width="3" opacity="0.7" />
  <path d="M 280 525 Q 430 535 580 525" stroke="#C98B48" stroke-width="2.5" opacity="0.5" />
  <path d="M 250 560 Q 430 570 610 560" stroke="#8C5E35" stroke-width="2" opacity="0.4" />

  <!-- Museum Exhibition Plaque / Border -->
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.35" />
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="#F7F3EC" stroke-width="0.7" opacity="0.25" />
</svg>
