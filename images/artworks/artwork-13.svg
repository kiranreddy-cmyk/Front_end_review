<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="veniceSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D3025" />
      <stop offset="40%" stop-color="#80593B" />
      <stop offset="75%" stop-color="#C2874E" />
      <stop offset="100%" stop-color="#FCE1A9" />
    </linearGradient>
    <linearGradient id="canalWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2874E" />
      <stop offset="35%" stop-color="#5E432A" />
      <stop offset="70%" stop-color="#2D2821" />
      <stop offset="100%" stop-color="#14120F" />
    </linearGradient>
  </defs>

  <!-- Venice Sky at Daybreak -->
  <rect width="800" height="360" fill="url(#veniceSky)" />

  <!-- Santa Maria della Salute Dome Silhouettes in Morning Mist -->
  <g fill="#4A3728" opacity="0.75">
    <!-- Grand Basilica Dome -->
    <path d="M 440 260 C 440 180 560 180 560 260 Z" />
    <polygon points="495,140 505,140 500,120" />
    <rect x="498" y="140" width="4" height="40" fill="#E5C384" />
    <!-- Campanile Tower Silhouette -->
    <rect x="360" y="160" width="28" height="120" />
    <polygon points="360,160 388,160 374,120" />
    <!-- Distant Palazzi Line along the Grand Canal -->
    <rect x="180" y="240" width="140" height="60" />
    <rect x="560" y="240" width="180" height="60" />
  </g>

  <!-- Midground Canal Posts (Briccole Wooden Moorings) -->
  <g fill="#241E18">
    <rect x="120" y="260" width="8" height="100" />
    <rect x="126" y="270" width="6" height="90" />
    <rect x="680" y="270" width="8" height="90" />
  </g>

  <!-- Grand Canal Waters with Luminous Golden Reflections -->
  <rect x="0" y="320" width="800" height="280" fill="url(#canalWater)" />

  <!-- Shimmering Canal Water Impasto Highlights -->
  <g stroke="#FCE1A9" stroke-linecap="round" opacity="0.8">
    <line x1="420" y1="340" x2="520" y2="340" stroke-width="4.5" />
    <line x1="380" y1="365" x2="560" y2="365" stroke-width="5" />
    <line x1="340" y1="400" x2="600" y2="400" stroke-width="4" />
    <line x1="280" y1="440" x2="640" y2="440" stroke-width="3" />
    <line x1="220" y1="490" x2="680" y2="490" stroke-width="2.5" opacity="0.6" />
  </g>

  <!-- Foreground Classical Venetian Gondola Silhouette -->
  <g transform="translate(180, 390)" fill="#120F0C">
    <!-- Gondola Bow & Curved Ferro (Metal Prow) -->
    <path d="M 0 50 C 60 48 180 50 240 70 C 180 85 40 85 -20 65 Z" />
    <!-- Traditional Metal Prow Comb (Ferro di Gondola) -->
    <path d="M -20 65 C -35 45 -45 10 -35 -15 C -25 -20 -15 0 -22 30 Z" />
    <!-- 6 Teeth representing Venice Sestieri -->
    <rect x="-42" y="-5" width="15" height="3" />
    <rect x="-40" y="5" width="15" height="3" />
    <rect x="-38" y="15" width="15" height="3" />
    <rect x="-36" y="25" width="15" height="3" />
  </g>

  <!-- Antique Gold Exhibition Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.45" />
</svg>
