<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Tuscan Summer Sky -->
    <linearGradient id="tuscanSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#384954" />
      <stop offset="45%" stop-color="#6F8894" />
      <stop offset="80%" stop-color="#C2CCD1" />
      <stop offset="100%" stop-color="#EBE8D8" />
    </linearGradient>
    <!-- Sunlit Rolling Ochre Hills -->
    <linearGradient id="hillOchre" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFB15B" />
      <stop offset="50%" stop-color="#BF893B" />
      <stop offset="100%" stop-color="#8C5C23" />
    </linearGradient>
    <linearGradient id="hillOlive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7A855E" />
      <stop offset="50%" stop-color="#55613D" />
      <stop offset="100%" stop-color="#384226" />
    </linearGradient>
  </defs>

  <!-- Tuscan Sky -->
  <rect width="800" height="340" fill="url(#tuscanSky)" />

  <!-- Soft Golden Sun Glaze -->
  <circle cx="620" cy="180" r="120" fill="#FFFBEB" opacity="0.3" />

  <!-- Distant Blue-Hazed Apennine Ridge -->
  <path d="M 0 310 Q 200 270 420 300 T 800 280 L 800 370 L 0 370 Z" fill="#6B7D85" opacity="0.5" />

  <!-- Rolling Tuscan Ochre Hills (Val d'Orcia Waves) -->
  <!-- Hill Wave 1 -->
  <path d="M 0 330 Q 240 280 500 340 Q 680 320 800 350 L 800 480 L 0 480 Z" fill="url(#hillOchre)" />

  <!-- Hill Wave 2 (Rich Olive & Terracotta) -->
  <path d="M 0 400 Q 300 340 600 420 Q 720 390 800 410 L 800 540 L 0 540 Z" fill="url(#hillOlive)" />

  <!-- Hill Wave 3 (Foreground Warm Ochre Fields) -->
  <path d="M 0 480 Q 260 430 520 490 Q 690 460 800 480 L 800 600 L 0 600 Z" fill="#8C5C23" />

  <!-- Classical Terracotta Farmhouse (Casale) on Hilltop -->
  <g transform="translate(460, 310)">
    <!-- Villa Body in Warm Stucco -->
    <rect x="0" y="20" width="70" height="35" fill="#E2CDB0" stroke="#7A5626" stroke-width="0.8" />
    <!-- Villa Tower -->
    <rect x="45" y="5" width="25" height="50" fill="#D4BD9E" />
    <!-- Terracotta Tile Roofs -->
    <polygon points="-5,20 35,5 75,20" fill="#A84B29" />
    <polygon points="40,5 57,-6 75,5" fill="#8F3C1D" />
  </g>

  <!-- Sentinel Italian Cypress Trees (Iconic Slender Silhouettes) -->
  <g fill="#1F2E1E">
    <!-- Cluster around Farmhouse -->
    <path d="M 440 370 Q 436 290 440 260 Q 444 290 440 370 Z" />
    <path d="M 450 370 Q 445 270 450 240 Q 455 270 450 370 Z" />
    <path d="M 545 365 Q 541 285 545 255 Q 549 285 545 365 Z" />
    <path d="M 556 370 Q 552 270 556 235 Q 560 270 556 370 Z" />

    <!-- Cypress Procession along Winding Farm Track (Foreground) -->
    <path d="M 160 520 Q 153 410 160 360 Q 167 410 160 520 Z" />
    <path d="M 180 535 Q 172 390 180 330 Q 188 390 180 535 Z" />
    <path d="M 205 550 Q 196 370 205 310 Q 214 370 205 550 Z" />
    <path d="M 235 565 Q 225 390 235 340 Q 245 390 235 565 Z" />
  </g>

  <!-- Winding Country Dirt Track -->
  <path d="M 180 570 Q 300 510 400 480 T 480 365" stroke="#DFB15B" stroke-width="5" fill="none" opacity="0.6" stroke-linecap="round" />

  <!-- Museum Exhibition Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.45" />
</svg>
