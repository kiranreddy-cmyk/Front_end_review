<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Dawn Atmosphere -->
    <linearGradient id="dawnSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22262E" />
      <stop offset="40%" stop-color="#464648" />
      <stop offset="70%" stop-color="#8E7860" />
      <stop offset="90%" stop-color="#D4AA6A" />
      <stop offset="100%" stop-color="#FCE1A9" />
    </linearGradient>
    <linearGradient id="harborWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AA6A" />
      <stop offset="30%" stop-color="#5C4D3B" />
      <stop offset="70%" stop-color="#2A2A2E" />
      <stop offset="100%" stop-color="#16171A" />
    </linearGradient>
  </defs>

  <!-- Atmospheric Dawn Sky -->
  <rect width="800" height="380" fill="url(#dawnSky)" />

  <!-- Luminous Rising Sun Disc Through Morning Fog -->
  <circle cx="480" cy="310" r="100" fill="#FFFDF5" opacity="0.45" />
  <circle cx="480" cy="310" r="38" fill="#FFFBEB" opacity="0.8" />

  <!-- Layered Architectural Cityscape (Receding Atmospheric Depth) -->
  <!-- Deep Background Towers (Hazy Mist Silhouettes) -->
  <g fill="#6E5D4B" opacity="0.5">
    <rect x="80" y="240" width="40" height="140" />
    <rect x="150" y="210" width="55" height="170" />
    <polygon points="177,150 155,210 200,210" />
    <rect x="230" y="230" width="35" height="150" />
    <rect x="520" y="190" width="60" height="190" />
    <polygon points="550,130 525,190 575,190" />
    <rect x="610" y="220" width="45" height="160" />
  </g>

  <!-- Midground Monumental Towers & Suspension Spans -->
  <g fill="#3A3734" opacity="0.85">
    <rect x="110" y="190" width="50" height="190" />
    <rect x="280" y="140" width="65" height="240" />
    <polygon points="312,80 285,140 340,140" />
    <!-- Fine Spire Antenna -->
    <line x1="312" y1="50" x2="312" y2="80" stroke="#E5C384" stroke-width="2" />
    
    <rect x="360" y="180" width="80" height="200" />
    <rect x="460" y="220" width="45" height="160" />
    <rect x="670" y="170" width="55" height="210" />
    <polygon points="697,110 675,170 720,170" />
  </g>

  <!-- Foreground Deep Charcoal Waterfront Structures -->
  <g fill="#1A1816">
    <rect x="0" y="320" width="90" height="60" />
    <rect x="180" y="270" width="70" height="110" />
    <polygon points="215,220 185,270 245,270" />
    <rect x="580" y="250" width="75" height="130" />
    <rect x="730" y="280" width="70" height="100" />
    <!-- Harbor Pier / Promenade -->
    <rect x="0" y="370" width="800" height="12" fill="#12100F" />
  </g>

  <!-- Harbor Mirror Water Surface -->
  <rect x="0" y="380" width="800" height="220" fill="url(#harborWater)" />

  <!-- Shimmering Golden Dawn Reflections (Long Exposure Effect) -->
  <g stroke="#FCE1A9" stroke-linecap="round" opacity="0.7">
    <line x1="450" y1="390" x2="510" y2="390" stroke-width="4.5" />
    <line x1="430" y1="410" x2="530" y2="410" stroke-width="5" />
    <line x1="410" y1="435" x2="550" y2="435" stroke-width="4" />
    <line x1="380" y1="465" x2="580" y2="465" stroke-width="3" />
    <line x1="340" y1="500" x2="620" y2="500" stroke-width="2.5" opacity="0.5" />
    <line x1="300" y1="540" x2="660" y2="540" stroke-width="1.8" opacity="0.35" />
  </g>

  <!-- Tower Vertical Light Spills in Water -->
  <line x1="312" y1="385" x2="312" y2="480" stroke="#D4AA6A" stroke-width="2" opacity="0.5" />
  <line x1="550" y1="385" x2="550" y2="470" stroke="#D4AA6A" stroke-width="2" opacity="0.5" />

  <!-- Exhibition Fine Line Frame -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.45" />
</svg>
