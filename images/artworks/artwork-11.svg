<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="metroDawn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" />
      <stop offset="40%" stop-color="#be185d" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#metroDawn)" />
  <!-- Sun Rising Behind Towers -->
  <circle cx="340" cy="300" r="90" fill="#ffffff" opacity="0.9" />
  <!-- Dense Architectural Cityscape with Windows -->
  <g fill="#1e1b4b">
    <!-- Back layer towers -->
    <rect x="40" y="220" width="50" height="230" opacity="0.5" />
    <polygon points="65,190 40,220 90,220" opacity="0.5" />
    <rect x="120" y="180" width="60" height="270" opacity="0.6" />
    <rect x="210" y="240" width="40" height="210" opacity="0.5" />
    <rect x="380" y="160" width="70" height="290" opacity="0.6" />
    <polygon points="415,120 380,160 450,160" opacity="0.6" />
    <rect x="480" y="200" width="55" height="250" opacity="0.5" />
    <!-- Front layer skyscrapers -->
    <rect x="0" y="280" width="60" height="170" fill="#0f172a" />
    <rect x="80" y="230" width="75" height="220" fill="#0f172a" />
    <rect x="180" y="290" width="50" height="160" fill="#0f172a" />
    <rect x="250" y="200" width="80" height="250" fill="#0f172a" />
    <line x1="290" y1="130" x2="290" y2="200" stroke="#f43f5e" stroke-width="3" />
    <circle cx="290" cy="128" r="4" fill="#f43f5e" />
    <rect x="350" y="260" width="65" height="190" fill="#0f172a" />
    <rect x="440" y="250" width="85" height="200" fill="#0f172a" />
    <rect x="545" y="270" width="60" height="180" fill="#0f172a" />
  </g>
  <!-- Glowing window grids -->
  <g fill="#fef08a" opacity="0.75">
    <rect x="90" y="250" width="5" height="7" /><rect x="105" y="250" width="5" height="7" /><rect x="120" y="250" width="5" height="7" /><rect x="135" y="250" width="5" height="7" />
    <rect x="90" y="270" width="5" height="7" /><rect x="105" y="270" width="5" height="7" /><rect x="135" y="270" width="5" height="7" />
    <rect x="90" y="290" width="5" height="7" /><rect x="120" y="290" width="5" height="7" /><rect x="135" y="290" width="5" height="7" />
    <rect x="265" y="220" width="6" height="8" /><rect x="285" y="220" width="6" height="8" /><rect x="305" y="220" width="6" height="8" />
    <rect x="265" y="240" width="6" height="8" /><rect x="305" y="240" width="6" height="8" />
    <rect x="265" y="260" width="6" height="8" /><rect x="285" y="260" width="6" height="8" />
    <rect x="460" y="270" width="6" height="8" /><rect x="480" y="270" width="6" height="8" /><rect x="500" y="270" width="6" height="8" />
  </g>
  <!-- Water Reflection in Foreground Bay -->
  <rect y="400" width="600" height="50" fill="#1e1b4b" />
  <line x1="280" y1="415" x2="400" y2="415" stroke="#fef08a" stroke-width="3" opacity="0.6" />
  <line x1="260" y1="425" x2="420" y2="425" stroke="#f59e0b" stroke-width="2.5" opacity="0.5" />
  <line x1="300" y1="435" x2="380" y2="435" stroke="#ea580c" stroke-width="2" opacity="0.4" />
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fef08a" text-anchor="end">Metropolis Awakening • Digital Matte</text>
</svg>
