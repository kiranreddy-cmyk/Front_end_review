<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="parchment" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#F5EFE3" />
      <stop offset="85%" stop-color="#EADBBE" />
      <stop offset="100%" stop-color="#D4C29D" />
    </radialGradient>
  </defs>

  <!-- Aged Renaissance Cotton Rag / Parchment Paper Ground -->
  <rect width="800" height="600" fill="url(#parchment)" />

  <!-- Classical Geometric Golden Ratio Construction Lines (Graphite / Sepia) -->
  <g stroke="#8A775C" stroke-width="0.8" opacity="0.45">
    <!-- Square and Vitruvian Circle -->
    <rect x="180" y="80" width="440" height="440" fill="none" stroke="#7A684D" stroke-width="1.2" />
    <circle cx="400" cy="300" r="220" fill="none" stroke="#7A684D" stroke-width="1.2" />
    <!-- Diagonal Harmonious Intersections -->
    <line x1="180" y1="80" x2="620" y2="520" />
    <line x1="180" y1="520" x2="620" y2="80" />
    <line x1="400" y1="50" x2="400" y2="550" />
    <line x1="150" y1="300" x2="650" y2="300" />
    <!-- Golden Section Harmonics -->
    <circle cx="400" cy="300" r="136" fill="none" stroke-dasharray="3,3" />
    <circle cx="400" cy="300" r="84" fill="none" stroke-dasharray="2,3" />
  </g>

  <!-- Classical Architectural Ionic Capital & Volute Silverpoint Study -->
  <g transform="translate(400, 300)" stroke="#3E3427" fill="none">
    <!-- Main Volute Spiral (Left) -->
    <path d="M 0 0 C -40 -30 -120 -30 -160 10 C -200 50 -190 120 -140 150 C -90 180 -30 150 -20 90 C -10 50 -50 30 -70 50 C -90 70 -80 90 -65 90" stroke-width="2.5" />
    <!-- Main Volute Spiral (Right) -->
    <path d="M 0 0 C 40 -30 120 -30 160 10 C 200 50 190 120 140 150 C 90 180 30 150 20 90 C 10 50 50 30 70 50 C 90 70 80 90 65 90" stroke-width="2.5" />

    <!-- Entablature / Abacus Moldings -->
    <line x1="-200" y1="-25" x2="200" y2="-25" stroke-width="2.8" />
    <line x1="-180" y1="-15" x2="180" y2="-15" stroke-width="1.8" />
    
    <!-- Egg and Dart Classical Carving Motifs -->
    <ellipse cx="-100" cy="-5" rx="14" ry="10" stroke-width="1.5" />
    <ellipse cx="-50" cy="-5" rx="14" ry="10" stroke-width="1.5" />
    <ellipse cx="0" cy="-5" rx="14" ry="10" stroke-width="1.5" />
    <ellipse cx="50" cy="-5" rx="14" ry="10" stroke-width="1.5" />
    <ellipse cx="100" cy="-5" rx="14" ry="10" stroke-width="1.5" />

    <!-- Delicate Cross-Hatching Shadows -->
    <g stroke="#4A3F31" stroke-width="0.8" opacity="0.6">
      <line x1="-160" y1="20" x2="-140" y2="40" />
      <line x1="-155" y1="30" x2="-135" y2="50" />
      <line x1="-150" y1="40" x2="-130" y2="60" />
      <line x1="-140" y1="60" x2="-120" y2="80" />
      
      <line x1="140" y1="20" x2="160" y2="40" />
      <line x1="135" y1="30" x2="155" y2="50" />
      <line x1="130" y1="40" x2="150" y2="60" />
      <line x1="120" y1="60" x2="140" y2="80" />
    </g>
  </g>

  <!-- Renaissance Atelier Annotation Notes (Handwritten Calligraphic Marks) -->
  <g fill="#5C4D38" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="14" opacity="0.75">
    <text x="180" y="550">Studio dell'ordine ionico — proporzione armonica</text>
    <text x="610" y="105" text-anchor="end">Proportio divina • ca. 1504</text>
  </g>

  <!-- Delicate Deckled Edge Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#B08D57" stroke-width="1" opacity="0.4" />
</svg>
