<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="absBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldShape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="coralShape" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="tealShape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#absBg)" />
  <!-- Bauhaus / Constructivist Abstract Geometric Composition -->
  <!-- Large Arch -->
  <path d="M 80 450 L 80 220 A 120 120 0 0 1 320 220 L 320 450 Z" fill="url(#coralShape)" opacity="0.85" />
  <!-- Golden Circle -->
  <circle cx="360" cy="170" r="110" fill="url(#goldShape)" opacity="0.9" />
  <!-- Teal Rectangle -->
  <rect x="220" y="80" width="160" height="260" fill="url(#tealShape)" opacity="0.75" transform="rotate(15 300 210)" />
  <!-- Crisp Black & White Striped Circle -->
  <g transform="translate(180, 260)">
    <circle cx="0" cy="0" r="70" fill="#f8fafc" />
    <path d="M -70 -30 L 70 -30 M -70 -10 L 70 -10 M -70 10 L 70 10 M -70 30 L 70 30 M -70 50 L 70 50" stroke="#0f172a" stroke-width="6" />
  </g>
  <!-- Thin Accent Lines & floating dots -->
  <line x1="50" y1="90" x2="550" y2="90" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8,8" opacity="0.4" />
  <line x1="420" y1="20" x2="420" y2="430" stroke="#fb7185" stroke-width="3" opacity="0.6" />
  <circle cx="480" cy="300" r="28" fill="#38bdf8" />
  <circle cx="510" cy="360" r="14" fill="#f43f5e" />
  <circle cx="120" cy="110" r="8" fill="#facc15" />
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fef08a" text-anchor="end">Geometric Reverie • Abstract Vector</text>
</svg>
