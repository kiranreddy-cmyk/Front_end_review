<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="warmOchre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5AF58" />
      <stop offset="100%" stop-color="#B37827" />
    </linearGradient>
    <linearGradient id="sageAbstract" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#739682" />
      <stop offset="100%" stop-color="#496655" />
    </linearGradient>
    <linearGradient id="charcoalAbstract" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D2825" />
      <stop offset="100%" stop-color="#1B1715" />
    </linearGradient>
    <linearGradient id="goldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1A9" />
      <stop offset="50%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#826129" />
    </linearGradient>
  </defs>

  <!-- Textured Warm Cream Gallery Linen -->
  <rect width="800" height="600" fill="#F4EFE6" />

  <!-- Background Tonal Ground Blocks -->
  <rect x="80" y="60" width="380" height="480" fill="#EADBCE" opacity="0.6" />
  <rect x="420" y="120" width="300" height="420" fill="#E2D4C3" opacity="0.5" />

  <!-- Bauhaus / Kandinsky Inspired Geometric Harmony -->
  <!-- Grand Sage Arch -->
  <path d="M 180 500 L 180 320 C 180 190 380 190 380 320 L 380 500 Z" fill="url(#sageAbstract)" />

  <!-- Overlapping Deep Charcoal Semi-Circle -->
  <path d="M 280 360 C 280 230 480 230 480 360 Z" fill="url(#charcoalAbstract)" />

  <!-- Luminous Ochre Disc -->
  <circle cx="500" cy="240" r="110" fill="url(#warmOchre)" />

  <!-- Antique Gold Leaf Crescent Accent -->
  <path d="M 460 160 C 520 180 550 250 530 310 C 560 260 550 190 460 160 Z" fill="url(#goldLeaf)" />

  <!-- Constructivist Fine Lines & Counter-balances -->
  <line x1="120" y1="280" x2="680" y2="280" stroke="#24201D" stroke-width="2.5" />
  <line x1="380" y1="80" x2="380" y2="520" stroke="url(#goldLeaf)" stroke-width="2" />
  <line x1="560" y1="120" x2="560" y2="480" stroke="#739682" stroke-width="1.5" stroke-dasharray="4,6" />

  <!-- Fine Floating Element Balance -->
  <circle cx="280" cy="180" r="16" fill="url(#goldLeaf)" />
  <circle cx="580" cy="380" r="32" fill="#24201D" />
  <rect x="220" y="380" width="80" height="12" fill="#F4EFE6" />

  <!-- Museum Exhibition Border -->
  <rect x="25" y="25" width="750" height="550" fill="none" stroke="#B08D57" stroke-width="1" opacity="0.45" />
</svg>
