<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Stormy Marine Sky -->
    <linearGradient id="marineSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3A3B" />
      <stop offset="40%" stop-color="#4A5857" />
      <stop offset="75%" stop-color="#7A8B88" />
      <stop offset="100%" stop-color="#C2CBC6" />
    </linearGradient>
    <!-- Deep Ocean Swell -->
    <linearGradient id="oceanSwell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3F5A56" />
      <stop offset="35%" stop-color="#263E3C" />
      <stop offset="70%" stop-color="#182C2C" />
      <stop offset="100%" stop-color="#0F1F20" />
    </linearGradient>
    <!-- Coastal Cliff Chiaroscuro -->
    <linearGradient id="cliffRock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A221C" />
      <stop offset="50%" stop-color="#3D322A" />
      <stop offset="100%" stop-color="#54453A" />
    </linearGradient>
  </defs>

  <!-- Atmospheric Sky -->
  <rect width="800" height="340" fill="url(#marineSky)" />

  <!-- Distant Horizon Sea Mist -->
  <rect x="0" y="300" width="800" height="60" fill="#8FA09C" opacity="0.4" />

  <!-- Rugged Coastal Headland Cliff (Left) -->
  <polygon points="0,180 80,240 140,220 220,330 240,420 180,480 0,520" fill="url(#cliffRock)" />
  <polygon points="0,220 60,260 120,310 180,410 120,470 0,500" fill="#1C1612" opacity="0.8" />

  <!-- Deep Ocean Ground -->
  <rect x="0" y="320" width="800" height="280" fill="url(#oceanSwell)" />

  <!-- Layered Impressionist Wave Swells & Foaming Crests -->
  <!-- Distant Roller -->
  <path d="M 180 340 Q 300 325 420 340 T 660 335 T 800 340 L 800 370 L 180 370 Z" fill="#3A524F" />
  <path d="M 220 342 Q 320 332 440 342 T 680 338" stroke="#E3EBE7" stroke-width="1.8" fill="none" opacity="0.65" />

  <!-- Midground Crashing Wave -->
  <path d="M 140 400 Q 280 370 420 405 T 700 390 T 800 410 L 800 470 L 140 470 Z" fill="#2D4644" />
  <!-- Luminous Foaming Lip -->
  <path d="M 160 402 Q 300 372 440 406 T 720 392" stroke="#F5F8F6" stroke-width="4.5" fill="none" opacity="0.85" />
  <path d="M 280 380 Q 380 388 480 408" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.95" />

  <!-- Majestic Foreground Surge & Swell -->
  <path d="M 0 460 Q 220 430 460 470 Q 640 450 800 480 L 800 600 L 0 600 Z" fill="#1A2D2C" />

  <!-- Heavy White Foaming Impasto Crest -->
  <path d="M 20 475 Q 240 440 480 485 Q 660 465 800 495" stroke="#F9FCFA" stroke-width="6.5" fill="none" stroke-linecap="round" />
  <path d="M 80 485 Q 280 455 520 498" stroke="#E0EBE6" stroke-width="3" fill="none" stroke-dasharray="8,6" />
  
  <!-- Coastal Shore Spray Particles / Glaze Droplets -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="210" cy="435" r="2.5" />
    <circle cx="230" cy="420" r="3" />
    <circle cx="245" cy="440" r="2" />
    <circle cx="360" cy="450" r="3.5" />
    <circle cx="480" cy="460" r="3" />
    <circle cx="505" cy="445" r="2" />
  </g>

  <!-- Antique Gold Museum Exhibition Trim -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.4" />
</svg>
