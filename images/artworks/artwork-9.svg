<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="40%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#nightSky)" />
  <!-- Lyrical Swirls & Expressive brushstrokes -->
  <circle cx="420" cy="140" r="100" fill="url(#moonGlow)" />
  <circle cx="420" cy="140" r="45" fill="#f8fafc" />
  <!-- Swirling colorful dynamic ribbons (Music / Serenade metaphor) -->
  <path d="M 0 350 C 150 250 250 420 380 300 C 480 200 520 280 600 240" fill="none" stroke="#a855f7" stroke-width="24" stroke-linecap="round" opacity="0.8" />
  <path d="M 0 320 C 120 220 270 380 400 260 C 490 170 540 240 600 200" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <path d="M 50 430 C 180 360 220 260 360 220 C 460 190 510 140 580 80" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <!-- Star splatters and musical notes dots -->
  <circle cx="100" cy="80" r="2.5" fill="#ffffff" />
  <circle cx="160" cy="120" r="3.5" fill="#fde047" />
  <circle cx="240" cy="70" r="2" fill="#ffffff" />
  <circle cx="320" cy="110" r="3" fill="#67e8f9" />
  <circle cx="500" cy="90" r="2.5" fill="#ffffff" />
  <circle cx="540" cy="170" r="3.5" fill="#f472b6" />
  <circle cx="210" cy="220" r="4" fill="#fde047" />
  <circle cx="290" cy="180" r="5" fill="#ffffff" />
  <!-- City silhouette skyline at base -->
  <polygon points="0,450 40,410 70,410 85,390 110,390 140,430 190,400 220,400 250,450 600,450" fill="#030712" />
  <text x="570" y="420" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="end">Midnight Serenade • Oil &amp; Gold Leaf</text>
</svg>
