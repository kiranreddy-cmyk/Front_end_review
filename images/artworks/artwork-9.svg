<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Midnight Sky / Prussian Depth -->
    <linearGradient id="midnightDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121721" />
      <stop offset="40%" stop-color="#1B2332" />
      <stop offset="75%" stop-color="#241E1C" />
      <stop offset="100%" stop-color="#151210" />
    </linearGradient>
    <!-- Antique Gold Leaf Impasto -->
    <linearGradient id="goldImpasto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="35%" stop-color="#D4A760" />
      <stop offset="70%" stop-color="#B08D57" />
      <stop offset="100%" stop-color="#735222" />
    </linearGradient>
    <!-- Raw Warm Belgian Linen -->
    <linearGradient id="rawLinen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5D9C8" />
      <stop offset="100%" stop-color="#D3C3AD" />
    </linearGradient>
  </defs>

  <!-- Deep Nocturne Canvas Surface -->
  <rect width="800" height="600" fill="url(#midnightDeep)" />

  <!-- Diagonal Swathe of Exposed Warm Linen Ground -->
  <path d="M 0 450 L 250 200 L 450 260 L 150 600 L 0 600 Z" fill="url(#rawLinen)" opacity="0.35" />

  <!-- Lyrical Sweeping Prussian Blue Brushwork Layer -->
  <path d="M 60 520 C 180 380 250 160 480 180 C 640 190 740 320 680 480 L 520 540 C 420 400 320 380 180 480 Z" fill="#182A3A" opacity="0.8" />
  
  <!-- Expressive Midnight Charcoal Impasto Strokes -->
  <path d="M 220 120 C 340 90 520 120 600 240 C 660 330 590 440 500 480 L 460 410 C 520 360 560 300 500 220 C 450 160 320 150 220 120 Z" fill="#0E1218" />

  <!-- Splashes and Sweeps of Radiant Antique Gold Leaf -->
  <!-- Primary Golden Arc -->
  <path d="M 140 460 C 260 340 350 200 560 160 C 620 150 670 170 710 210" stroke="url(#goldImpasto)" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.95" />
  
  <!-- Counterpoint Gold Glaze Strokes -->
  <path d="M 180 490 C 280 400 360 290 500 260" stroke="#FFF5DE" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M 320 380 C 420 320 560 310 660 370" stroke="url(#goldImpasto)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9" />

  <!-- Expressive Splatters & Droplets of Pure Gilt (Modern Fine Art Detail) -->
  <g fill="url(#goldImpasto)">
    <circle cx="280" cy="220" r="4.5" />
    <circle cx="310" cy="180" r="6" />
    <circle cx="340" cy="210" r="3.5" />
    <circle cx="480" cy="130" r="5" />
    <circle cx="530" cy="100" r="3" />
    <circle cx="620" cy="140" r="7" />
    <circle cx="660" cy="180" r="4" />
    <circle cx="690" cy="280" r="5.5" />
    <circle cx="580" cy="420" r="4" />
    <circle cx="210" cy="380" r="5" />
  </g>

  <!-- Fine Antique Gilt Frame Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.45" />
</svg>
