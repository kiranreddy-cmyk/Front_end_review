<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Rembrandt Atelier Chiaroscuro -->
    <radialGradient id="craftsmanGlow" cx="42%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E89B48" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#8C4E20" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#361D0C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#120A04" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="warmBeard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2EDE4" />
      <stop offset="50%" stop-color="#C2B7A5" />
      <stop offset="100%" stop-color="#6E6150" />
    </linearGradient>
    <linearGradient id="leatherApron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#593418" />
      <stop offset="60%" stop-color="#381E0C" />
      <stop offset="100%" stop-color="#1E0E04" />
    </linearGradient>
  </defs>

  <!-- Deep Umber Studio Darkness -->
  <rect width="800" height="600" fill="#120A04" />
  
  <!-- Warm Atelier Candle / Lantern Atmospheric Halo -->
  <rect width="800" height="600" fill="url(#craftsmanGlow)" />

  <!-- Artisan Silhouette & Workbench Shadow -->
  <!-- Heavy Oak Workbench Surface -->
  <polygon points="0,480 800,450 800,600 0,600" fill="#1A1008" />
  <line x1="0" y1="480" x2="800" y2="450" stroke="#8C4E20" stroke-width="1.8" opacity="0.6" />

  <!-- Classical Master Artisan in Contemplation -->
  <g transform="translate(240, 70)">
    <!-- Artisan Felt Cap / Beret -->
    <path d="M 80 120 C 60 70 120 30 200 40 C 270 50 290 100 280 140 Z" fill="#24170D" />
    
    <!-- Forehead & Weathered Character Lines (Chiaroscuro Highlight) -->
    <path d="M 120 120 C 140 105 210 105 230 125 C 235 155 220 190 205 210 L 150 210 C 130 185 115 150 120 120 Z" fill="#FCE4C8" />
    <!-- Character / Wisdom Wrinkles -->
    <path d="M 140 135 Q 180 130 215 140" stroke="#8C4E20" stroke-width="1.8" fill="none" opacity="0.6" />
    <path d="M 145 150 Q 180 145 210 155" stroke="#8C4E20" stroke-width="1.8" fill="none" opacity="0.6" />

    <!-- Focused Downcast Eye under Heavy Brow -->
    <path d="M 160 170 Q 185 165 205 178" stroke="#361D0C" stroke-width="3.5" fill="none" />
    <!-- Aquiline Nose with Lantern Glaze -->
    <polygon points="205,170 235,225 210,235" fill="#E89B48" />

    <!-- Venerable Silver Beard & Whiskers (Rich Layered Brushstrokes) -->
    <path d="M 150 230 C 130 270 130 350 180 400 C 220 440 260 410 270 340 C 280 280 260 230 230 230 Z" fill="url(#warmBeard)" />
    <!-- Highlight Strands in Beard -->
    <path d="M 180 240 Q 160 320 200 380" stroke="#FFFDF8" stroke-width="2.5" fill="none" opacity="0.8" />
    <path d="M 205 240 Q 210 330 230 370" stroke="#FFFDF8" stroke-width="2" fill="none" opacity="0.75" />

    <!-- Weathered Leather Apron & Linen Shirt -->
    <path d="M 100 340 C 60 410 40 480 30 520 L 360 520 C 340 450 320 380 280 330 Z" fill="url(#leatherApron)" />
    
    <!-- Sculptor's / Carver's Chisel Tool in Hand -->
    <line x1="260" y1="380" x2="340" y2="440" stroke="#B08D57" stroke-width="6" stroke-linecap="round" />
    <polygon points="340,440 365,458 355,465 330,447" fill="#C5C0B8" />
  </g>

  <!-- Antique Brass Oil Lamp on Workbench (Light Source Reference) -->
  <g transform="translate(140, 390)">
    <!-- Cast Shadow -->
    <ellipse cx="40" cy="85" rx="35" ry="10" fill="#0A0603" opacity="0.8" />
    <!-- Brass Base and Reservoir -->
    <ellipse cx="40" cy="75" rx="28" ry="10" fill="#B08D57" />
    <rect x="25" y="45" width="30" height="30" fill="#8C5E28" />
    <!-- Glass Chimney -->
    <rect x="28" y="10" width="24" height="35" fill="#FFF8E7" opacity="0.3" stroke="#D4A760" stroke-width="1" />
    <!-- Flame -->
    <path d="M 40 15 C 32 30 34 38 40 42 C 46 38 48 30 40 15 Z" fill="#FFFDF8" />
    <circle cx="40" cy="35" r="14" fill="#E89B48" opacity="0.5" />
  </g>

  <!-- Antique Gold Exhibition Frame Line -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#B08D57" stroke-width="1.2" opacity="0.45" />
</svg>
