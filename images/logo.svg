<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%">
  <defs>
    <linearGradient id="zenithGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9e791b" />
    </linearGradient>
    <linearGradient id="zenithLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e5e7eb" />
    </linearGradient>
  </defs>

  <!-- Luxury Gallery Diamond Emblem -->
  <g transform="translate(16, 14)">
    <rect x="8" y="8" width="56" height="56" rx="4" fill="#12151c" stroke="url(#zenithGold)" stroke-width="2" transform="rotate(45 36 36)" />
    <rect x="15" y="15" width="42" height="42" rx="2" fill="none" stroke="url(#zenithGold)" stroke-width="1" opacity="0.65" transform="rotate(45 36 36)" />
    <!-- Geometric Z Monogram -->
    <path d="M 25 26 L 47 26 L 25 46 L 47 46" stroke="url(#zenithGold)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="36" cy="14" r="2.2" fill="#f5d77f" />
  </g>

  <!-- Brand Wordmark -->
  <text x="104" y="53" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="40" font-weight="700" fill="url(#zenithLight)" letter-spacing="4">ZEN<tspan fill="url(#zenithGold)">ITH</tspan></text>

  <!-- Gold Divider -->
  <line x1="106" y1="64" x2="352" y2="64" stroke="url(#zenithGold)" stroke-width="1" opacity="0.55" />

  <!-- Subtitle -->
  <text x="106" y="80" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#d4af37" letter-spacing="4.6">FINE ART GALLERY &amp; AUCTIONS</text>
</svg>
