<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — ArtVista Online Art Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand-logo">
        <img src="images/logo.svg" alt="ArtVista Logo">
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="artworks.html" class="active">Gallery</a></li>
        <li><a href="artist-profile.html">Artists</a></li>
        <li><a href="auction.html">Auctions</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="about.html">About</a></li>
      </ul>

      <div class="nav-actions" id="navActions">
        <!-- Injected dynamically via auth.js -->
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top: 40px;">
      <!-- Page Header -->
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div>
          <span class="section-subtitle">Exhibition Catalog</span>
          <h1 style="font-size: 2.2rem; font-weight: 800;">Curated Artworks</h1>
        </div>
        <div>
          <span class="badge badge-category" id="artworksCount" style="font-size: 0.9rem; padding: 6px 14px;">Loading...</span>
        </div>
      </div>

      <!-- Controls: Search, Category Filters, & Sorting (CSS Grid & Flexbox) -->
      <div class="gallery-controls">
        <div class="search-sort-row">
          <!-- Real-time Search Input -->
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by artwork name, artist, or category (e.g. 'Landscape', 'Elena')...">
          </div>

          <!-- Sort Select Dropdown -->
          <div style="min-width: 200px;">
            <select id="sortSelect" class="form-control" style="cursor: pointer;">
              <option value="default">Featured / Default</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="name-asc">Artwork Name: A to Z</option>
              <option value="newest">Newest Arrivals</option>
            </select>
          </div>
        </div>

        <!-- Category Filter Pills (Flexbox) -->
        <div class="filter-pills-row">
          <button class="filter-pill active" data-category="All">All Categories</button>
          <button class="filter-pill" data-category="Painting">Painting</button>
          <button class="filter-pill" data-category="Digital Art">Digital Art</button>
          <button class="filter-pill" data-category="Photography">Photography</button>
          <button class="filter-pill" data-category="Drawing">Drawing</button>
          <button class="filter-pill" data-category="Portrait">Portrait</button>
          <button class="filter-pill" data-category="Landscape">Landscape</button>
          <button class="filter-pill" data-category="Abstract">Abstract</button>
          <button class="filter-pill" data-category="Sculpture">Sculpture</button>
        </div>
      </div>

      <!-- Artwork Cards Grid (CSS Grid) -->
      <div class="artwork-grid" id="galleryGrid">
        <!-- Rendered dynamically via artworks.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ArtVista Online Art Gallery. All rights reserved.</div>
      <div>SDC Project Review-1 • HTML5, CSS3 &amp; Vanilla JavaScript</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/artworks.js"></script>
</body>
</html>
